{% extends 'base.html' %}{% block title %}Profile | Closet Intelligence{% endblock %}{% block content %}<div class="page"><div class="eyebrow">Your point of view</div><h1>Personal style.</h1><form method="post" class="panel" style="max-width:760px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label>Name</label><input name="name" value="{{ current_user.name }}"></div><div class="form-group"><label>Email</label><input value="{{ current_user.email }}" disabled></div><div class="form-group"><label>Preferred colours</label><input name="preferred_colours" value="{{ current_user.profile.get('preferred_colours')|join(', ') }}" placeholder="cream, navy, olive"></div><div class="form-group"><label>Preferred styles</label><input name="preferred_styles" value="{{ current_user.profile.get('preferred_styles')|join(', ') }}" placeholder="tailored, relaxed, minimal"></div><button class="button">Save preferences</button></form><form method="post" action="{{ url_for('auth.logout') }}" style="margin-top:18px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button secondary">Sign out</button></form></div>{% endblock %}
